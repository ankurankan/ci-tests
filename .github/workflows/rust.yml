name: Rust CI

# NOTE: The build/test/lint commands below were verified by running them locally
# against this branch's toolchain. They are NOT exercised on GitHub Actions until
# this workflow runs there, so the exact runner setup (toolchain versions, OS
# package availability) may still need tweaks.
#
# The workspace is no longer built/tested as a single step: the binding crates
# (fastcit-python / fastcit / fastcit-js) each need their own non-cargo toolchain (maturin,
# rextendr/R, wasm-pack) and are covered by python.yml / r.yml / js.yml. This
# workflow builds and gates only the pure-Rust core crate (fastcit_core), whose tests
# include the 80-case shared golden parity fixture.

on:
  push:
    branches: [main]
    paths:
      - 'crates/ci-core/**'
      - 'crates/ci-python/**'
      - 'crates/ci-r/**'
      - 'crates/ci-js/**'
      - 'tests/fixtures/**'
      - 'devtools/extension_templates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'crates/ci-core/**'
      - 'crates/ci-python/**'
      - 'crates/ci-r/**'
      - 'crates/ci-js/**'
      - 'tests/fixtures/**'
      - 'devtools/extension_templates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust_fmt:
    name: Rust Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      # Verified locally: `cargo fmt --all -- --check`
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Rust Clippy Lints (fastcit_core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Verified locally: `cargo clippy -p fastcit-core --all-targets -- -D warnings`.
      # Scoped to fastcit_core so this job needs no Python/R/wasm toolchain; the
      # binding crates are linted by their own workflows.
      - name: Run Clippy
        run: cargo clippy -p fastcit-core --all-targets -- -D warnings

  rust_test:
    name: Rust Tests (fastcit_core)
    needs: [rust_fmt, clippy]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test -p fastcit-core --verbose

      # Each example prints the fields of its result. The `//` comments under each
      # println! line show the output. check_output.py compares the two; a number
      # matches to the precision written in the comment.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the example output checker
        run: python -m doctest crates/ci-core/examples/check_output.py

      - name: Run examples
        shell: bash
        run: |
          for f in crates/ci-core/examples/*.rs; do
            cargo run -q -p fastcit-core --example "$(basename "$f" .rs)" | python crates/ci-core/examples/check_output.py "$f"
          done
