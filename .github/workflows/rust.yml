name: Rust CI

# NOTE: The build/test/lint commands below were verified by running them locally
# against this branch's toolchain. They are NOT exercised on GitHub Actions until
# this workflow runs there, so the exact runner setup (toolchain versions, OS
# package availability) may still need tweaks.
#
# The workspace is no longer built/tested as a single step: the binding crates
# (fastcit-python / fastcit / fastcit-js) each need their own non-cargo toolchain (maturin,
# rextendr/R, wasm-pack) and are covered by python.yml / r.yml / js.yml. This
# workflow builds and gates only the pure-Rust core crate (fastcit_core), whose tests
# include the 80-case shared golden parity fixture.

on:
  push:
    branches: [main]
    paths:
      - 'crates/ci-core/**'
      - 'crates/ci-python/**'
      - 'crates/ci-r/**'
      - 'crates/ci-js/**'
      - 'tests/fixtures/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'crates/ci-core/**'
      - 'crates/ci-python/**'
      - 'crates/ci-r/**'
      - 'crates/ci-js/**'
      - 'tests/fixtures/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust_fmt:
    name: Rust Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      # Verified locally: `cargo fmt --all -- --check`
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Rust Clippy Lints (fastcit_core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Verified locally: `cargo clippy -p fastcit-core --all-targets -- -D warnings`.
      # Scoped to fastcit_core so this job needs no Python/R/wasm toolchain; the
      # binding crates are linted by their own workflows.
      - name: Run Clippy
        run: cargo clippy -p fastcit-core --all-targets -- -D warnings

  rust_test:
    name: Rust Tests (fastcit_core)
    needs: [rust_fmt, clippy]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test -p fastcit-core --verbose

      # Run every documentation example and check its seeded p-value: hsic uses
      # dependent data (p < 0.001), pearson_equivalence must reject
      # non-equivalence (p < 0.05), all others use conditionally independent
      # data (p > 0.05).
      - name: Run examples
        shell: bash
        run: |
          for f in crates/ci-core/examples/*.rs; do
            key=$(basename "$f" .rs)
            p=$(cargo run -q -p fastcit-core --example "$key")
            echo "$key: $p"
            case "$key" in
              hsic) cond='p < 0.001' ;;
              pearson_equivalence) cond='p < 0.05' ;;
              *) cond='p > 0.05' ;;
            esac
            awk -v p="$p" "BEGIN { exit !($cond) }" || { echo "unexpected p-value for $key"; exit 1; }
          done
