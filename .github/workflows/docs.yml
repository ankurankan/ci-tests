name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "crates/ci-core/**"
      - "crates/ci-js/**"
      - "crates/ci-python/**"
      - "crates/ci-r/**"
      - "docs/site/**"
      - "benchmarks/results/**"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-rust-docs:
    name: Build Rust Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build Rust docs
        run: cargo doc --no-deps -p fastcit-core

      - name: Upload Rust docs
        uses: actions/upload-artifact@v4
        with:
          name: rust-docs
          path: target/doc/

  build-r-docs:
    name: Build R Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: crates/ci-r
          extra-packages: any::devtools, any::rextendr, any::pkgdown

      - name: Generate R wrappers
        working-directory: crates/ci-r
        run: rextendr::document()
        shell: Rscript {0}

      - name: Build pkgdown site
        working-directory: crates/ci-r
        run: pkgdown::build_site(new_process = FALSE)
        shell: Rscript {0}

      - name: Upload R docs
        uses: actions/upload-artifact@v4
        with:
          name: r-docs
          path: crates/ci-r/docs/

  build-js-docs:
    name: Build JavaScript Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM package
        working-directory: crates/ci-js
        run: wasm-pack build --target nodejs --out-dir pkg

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install TypeDoc
        run: npm install -g typedoc typescript

      - name: Build JavaScript docs
        working-directory: crates/ci-js
        run: typedoc --entryPoints pkg/fastcit.d.ts --skipErrorChecking --out js-docs

      - name: Upload JavaScript docs
        uses: actions/upload-artifact@v4
        with:
          name: js-docs
          path: crates/ci-js/js-docs/

  build-python-docs:
    name: Build Python Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        working-directory: crates/ci-python
        run: pip install maturin numpy pdoc

      - name: Build and install Python package
        working-directory: crates/ci-python
        run: pip install -e . --no-build-isolation

      - name: Build Python docs
        working-directory: crates/ci-python
        run: pdoc fastcit -o python-docs

      - name: Upload Python docs
        uses: actions/upload-artifact@v4
        with:
          name: python-docs
          path: crates/ci-python/python-docs/

  deploy:
    name: Deploy to GitHub Pages
    needs: [build-rust-docs, build-r-docs, build-js-docs, build-python-docs]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Check out first: checkout cleans the workspace, so it must run before the downloads.
      - uses: actions/checkout@v5

      - name: Download Rust docs
        uses: actions/download-artifact@v4
        with:
          name: rust-docs
          path: site/rust/

      - name: Download R docs
        uses: actions/download-artifact@v4
        with:
          name: r-docs
          path: site/r/

      - name: Download JavaScript docs
        uses: actions/download-artifact@v4
        with:
          name: js-docs
          path: site/js/

      - name: Download Python docs
        uses: actions/download-artifact@v4
        with:
          name: python-docs
          path: site/python/

      - name: Add the home page and the benchmark data
        run: |
          cp -R docs/site/. site/
          cp benchmarks/results/summary.json site/benchmarks.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
