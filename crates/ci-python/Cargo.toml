[package]
name = "fastcit-python"
version = "0.1.0"
edition = "2021"
authors = ["Ankur Ankan <ankurankan@gmail.com>"]
license = "MIT"
description = "FastCIT: Fast Conditional Independence Tests (Python bindings)"
repository = "https://github.com/pgmpy/ci-tests"

[dependencies]
fastcit-core = { path = "../ci-core" }
numpy = { version = "0.24" }
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py310"] }

[lints]
workspace = true

[lib]
name = "fastcit_python"
crate-type = ["cdylib", "rlib"]
