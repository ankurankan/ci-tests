[package]
name = "fastcit-core"
version = "0.1.0"
edition = "2021"
authors = ["Ankur Ankan <ankurankan@gmail.com>"]
license = "MIT"
description = "FastCIT: Fast Conditional Independence Tests"
repository = "https://github.com/pgmpy/FastCIT"
homepage = "https://pgmpy.org/FastCIT/"
keywords = ["statistics", "causal-inference", "conditional-independence"]
categories = ["science"]

[dependencies]
statrs = { workspace = true }
faer = { workspace = true }
thiserror = "2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
