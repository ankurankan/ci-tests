[package]
name = 'fastcit'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.85'

[workspace]
members = [ 'ci-core' ]
resolver = '2'

[workspace.dependencies]
statrs = { version = '0.18.0', default-features = false }
faer = { version = "0.24", default-features = false, features = ["std", "linalg"] }

[workspace.lints.rust]
unsafe_code = 'forbid'

[workspace.lints.clippy]
all = 'warn'
pedantic = 'warn'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'fastcit'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
fastcit-core = { path = 'ci-core' }
extendr-api = '0.9.0'
