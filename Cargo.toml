[workspace]
members = [
    "crates/ci-core",
    "crates/ci-python",
    "crates/ci-js",
]
resolver = "2"

[workspace.dependencies]
statrs = { version = "0.18.0", default-features = false }
faer = { version = "0.24", default-features = false, features = ["std", "linalg"] }

# Linting/development
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = true
codegen-units = 1
